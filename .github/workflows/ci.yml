name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: pnpm quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality

  postgres:
    name: PostgreSQL migration and bootstrap
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: citari_admin
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: citari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citari_admin -d citari"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://citari_admin:ci-only-not-production@localhost:5432/citari?schema=public
      BOOTSTRAP_DATABASE_URL: postgresql://citari_admin:ci-only-not-production@localhost:5432/citari?schema=public
      PG_TEST_URL: postgresql://citari_admin:ci-only-not-production@localhost:5432/citari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate && pnpm db:generate && pnpm db:migrate:deploy
      - name: Prove bootstrap idempotency and absence of demo data
        run: |
          printf '%s' 'CiTemporaryPassword2026A' | pnpm admin:bootstrap
          printf '%s' 'CiTemporaryPassword2026A' | pnpm admin:bootstrap
          test "$(psql "$PG_TEST_URL" -tAc 'SELECT count(*) FROM users')" = "1"
          test "$(psql "$PG_TEST_URL" -tAc 'SELECT count(*) FROM tenants')" = "0"

  images:
    name: Production Docker images
    runs-on: ubuntu-latest
    needs: [quality, postgres]
    strategy:
      matrix:
        include:
          - dockerfile: apps/api/Dockerfile
            image: citari-api
          - dockerfile: apps/frontend/Dockerfile
            image: citari-frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:ci .
